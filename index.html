<!-- prototype banner -->
<div class="proto-bar" id="protoBar">
  <span class="proto-dot"></span>

  <button class="proto-x" onclick="document.getElementById('protoBar').remove()" aria-label="Dismiss">&times;</button>

</div>

  <div class="sheet-bg" onclick="UI.closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

</body>
</html>
